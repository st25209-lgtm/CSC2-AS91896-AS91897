{% extends "base.html" %}

{% block title %} Invoice {% endblock %}

{% block content %}
<!DOCTYPE html>
<link rel="stylesheet" href="static/css/invoice.css">
<div class="invoice-area">
    <div class="c-heading">
        <h1 id="c-heading">Dream Pizzas - INVOICE STATEMENT</h1>
    </div>
    <div class="invoice-details">
        <div class="c-name">
            <span id="c-tags">Customer Name: {{ customer_name }}</span><br>
            <span id="c-tags">Invoice Date: {{ invoice_date }}</span><br>
            <span id="c-tags">Invoice Number: {{ invoice_number }}</span><br>
        </div>
        <div class="orders-tab">
            <div class="c-orders c-orders-heading">
            </div>
            </div>
        </div>
        </div>
    </div>
</div>

</html>

{% endblock %}
